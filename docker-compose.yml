services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: aplx_ams_django.settings.production
      POSTGRES_DB: aplx_ams
      POSTGRES_USER: aplx_ams_owner
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    secrets:
      - django_secret_key
      - db_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: aplx_ams
      POSTGRES_USER: aplx_ams_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aplx_ams_owner -d aplx_ams"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  db_password:
    file: ./secrets/db_password.txt
