[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aplx_ams_django.settings.base"
testpaths = ["src"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = [
    "src/aplx_ams_django/accounts/tests/test_models.py",
    "src/aplx_ams_django/accounts/tests/test_auth_api.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/aplx_ams_django/organizations/tests/test_api.py" = ["I001"]
"src/aplx_ams_django/accounts/tests/test_models.py" = ["S106"]
"src/aplx_ams_django/accounts/tests/test_api.py" = ["S106", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "aplx_ams_django.permissions",
    "aplx_ams_django.organizations.*",
    "aplx_ams_django.organizations.tests.*",
    "aplx_ams_django.accounts.*",
    "aplx_ams_django.accounts.tests.*",
]
disable_error_code = ["misc", "no-any-return"]
